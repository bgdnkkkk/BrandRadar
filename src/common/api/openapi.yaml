          additionalProperties:
            type: integer
            format: int64
        top_sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceMentionCount"

    SourceMentionCount:
      type: object
      properties:
        source_id:
          type: string
          format: uuid
        count:
          type: integer
          format: int64

    TimelinePoint:
      type: object
      properties:
        bucket:
          type: string
          format: date-time
        count:
          type: integer
          format: int64
        sentiment:
          type: string

    # ── Event ──────────────────────────────────────────
    EventRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        source_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Alert ──────────────────────────────────────────
    AlertRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        type:
          type: string
        mention_count:
          type: integer
        threshold:
          type: integer
        sentiment_summary:
          type: object
        status:
          type: string
          enum: [pending, sent, failed]
        sent_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── Alert Config ───────────────────────────────────
    AlertConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        spike_threshold:
          type: integer
        spike_window_minutes:
          type: integer
        cooldown_minutes:
          type: integer
        notification_channels:
          type: array
          items:
            type: object
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpsertAlertConfigRequest:
      type: object
      required: [spike_threshold, spike_window_minutes, cooldown_minutes, enabled]
      properties:
        spike_threshold:
          type: integer
          minimum: 1
        spike_window_minutes:
          type: integer
          minimum: 1
        cooldown_minutes:
          type: integer
          minimum: 1
        notification_channels:
          type: array
          items:
            type: object
        enabled:
          type: boolean

    # ── Health ─────────────────────────────────────────
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
        redis:
          type: string
        nats:
          type: string
